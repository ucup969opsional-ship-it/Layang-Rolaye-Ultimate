<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kite Battle - Adu Layang-Layang</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #gameContainer {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, #6ec6ff 0%, #b3e5fc 70%, #a5d6a7 100%);
    touch-action: none;
  }

  /* ===== MENU UTAMA ===== */
  #menuScreen {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #1a237e 0%, #0d47a1 50%, #01579b 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
    padding: 20px;
    z-index: 100;
  }

  .menu-kite {
    font-size: 80px;
    margin-bottom: 15px;
    filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.7));
  }

  .menu-title {
    font-size: 34px;
    font-weight: bold;
    color: #FFD700;
    letter-spacing: 4px;
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
  }

  .menu-sub {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.85);
    letter-spacing: 2px;
    margin-bottom: 25px;
  }

  .menu-highscore {
    font-size: 13px;
    color: #FFD700;
    margin-bottom: 30px;
    min-height: 18px;
  }

  /* TOMBOL MENU */
  #startBtn {
    padding: 16px 44px;
    font-size: 18px;
    background: #FFD700;
    color: #333;
    border: none;
    border-radius: 12px;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
    -webkit-tap-highlight-color: transparent;
  }
  #startBtn:active {
    background: #FFC107;
    transform: scale(0.97);
  }

  /* Credit bawah */
  .menu-credit {
    position: absolute;
    bottom: 40px;
    text-align: center;
    pointer-events: none;
  }
  .menu-credit .label {
    display: block;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 3px;
    margin-bottom: 8px;
  }
  .menu-credit .names {
    font-size: 16px;
    font-weight: bold;
    color: #FFD700;
    text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
  }

  /* ===== HUD GAME ===== */
  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: none;
    justify-content: space-between;
    font-weight: bold;
    font-size: 13px;
    z-index: 5;
    pointer-events: none;
  }
  #hud.visible { display: flex; }
  .hud-box {
    background: rgba(0,0,0,0.5);
    color: white;
    padding: 6px 10px;
    border-radius: 8px;
  }
  .player-hud { border-left: 4px solid #2196F3; }
  .enemy-hud  { border-right: 4px solid #F44336; text-align: right; }
  .hp-bar {
    width: 100px;
    height: 8px;
    background: rgba(255,255,255,0.3);
    border-radius: 4px;
    margin-top: 4px;
    overflow: hidden;
  }
  .hp-fill {
    height: 100%;
    width: 100%;
    transition: width 0.2s;
  }
  .player-hud .hp-fill { background: #2196F3; }
  .enemy-hud .hp-fill  { background: #F44336; }

  #scoreHud {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.55);
    color: white;
    padding: 6px 14px;
    border-radius: 10px;
    font-weight: bold;
    text-align: center;
    display: none;
    z-index: 5;
    min-width: 110px;
    pointer-events: none;
  }
  #scoreHud.visible { display: block; }
  #scoreHud .score-value {
    font-size: 20px;
    color: #FFD700;
    display: block;
    line-height: 1.1;
  }
  #scoreHud .score-label {
    font-size: 10px;
    color: rgba(255,255,255,0.7);
    letter-spacing: 2px;
  }
  #scoreHud .wave-info {
    font-size: 10px;
    color: #90CAF9;
    margin-top: 2px;
  }

  /* Floating text skor */
  .floating-score {
    position: absolute;
    color: #FFD700;
    font-weight: bold;
    font-size: 20px;
    pointer-events: none;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    z-index: 6;
    animation: floatScore 1s ease-out forwards;
  }
  @keyframes floatScore {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    30%  { opacity: 1; transform: translate(-50%, -60%) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%, -120%) scale(1); }
  }

  /* ===== GAME OVER OVERLAY ===== */
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
    padding: 20px;
    z-index: 200;
  }
  #overlay.visible { display: flex; }
  #overlay h1 { font-size: 30px; margin-bottom: 10px; color: #FFD700; }
  #overlay p { margin-bottom: 12px; font-size: 14px; line-height: 1.6; max-width: 400px; }
  #overlay .final-score {
    font-size: 42px;
    color: #FFD700;
    font-weight: bold;
    margin: 5px 0;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
  }
  #overlay .new-record {
    color: #4CAF50;
    font-size: 14px;
    margin-bottom: 12px;
    animation: pulse 0.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  #overlay button {
    padding: 14px 32px;
    font-size: 16px;
    background: #FFD700;
    color: #333;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    margin-top: 10px;
    -webkit-tap-highlight-color: transparent;
  }
  #overlay button:active { transform: scale(0.97); background: #FFC107; }

  /* ===== KONTROL BAWAH ===== */
  #controls {
    position: absolute;
    bottom: 20px;
    left: 0;
    right: 0;
    display: none;
    justify-content: center;
    gap: 15px;
    padding: 0 20px;
    z-index: 5;
  }
  #controls.visible { display: flex; }
  .ctrl-btn {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    border: 2px solid rgba(255,255,255,0.6);
    color: white;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: none;
    font-weight: bold;
    -webkit-tap-highlight-color: transparent;
  }
  .ctrl-btn:active { background: rgba(255,255,255,0.5); }

  .hint {
    position: absolute;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.9);
    font-size: 12px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    text-align: center;
    pointer-events: none;
    display: none;
    z-index: 5;
  }
  .hint.visible { display: block; }

  /* Wave notification */
  #waveNotif {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #FFD700;
    font-size: 40px;
    font-weight: bold;
    text-shadow: 0 0 30px rgba(255, 215, 0, 0.8), 0 0 60px rgba(255, 215, 0, 0.5);
    pointer-events: none;
    opacity: 0;
    z-index: 8;
    letter-spacing: 4px;
  }
  #waveNotif.show {
    animation: waveShow 1.8s ease-out;
  }
  @keyframes waveShow {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    20%  { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
    70%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
  }

  @media (max-width: 600px) {
    .menu-title { font-size: 26px; letter-spacing: 2px; }
    .menu-kite { font-size: 65px; }
    #overlay h1 { font-size: 22px; }
    #overlay p { font-size: 13px; }
    #overlay .final-score { font-size: 34px; }
    #waveNotif { font-size: 30px; }
  }
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="game"></canvas>

  <!-- ===== MENU UTAMA ===== -->
  <div id="menuScreen">
    <div class="menu-kite">🪁</div>
    <div class="menu-title">KITE BATTLE</div>
    <div class="menu-sub">Adu Layang-Layang</div>
    <div class="menu-highscore" id="menuHighscore"></div>
    <button id="startBtn" type="button" onclick="window.__startGame && window.__startGame()">MULAI PERMAINAN</button>
    <div class="menu-credit">
      <span class="label">— CREATED BY —</span>
      <span class="names">Rinaldi, Dani G, Aliamsyah</span>
    </div>
  </div>

  <!-- HUD PLAYER -->
  <div id="hud">
    <div class="hud-box player-hud">
      🪁 KAMU
      <div class="hp-bar"><div class="hp-fill" id="playerHp"></div></div>
    </div>
    <div class="hud-box enemy-hud">
      MUSUH 🪁
      <div class="hp-bar"><div class="hp-fill" id="enemyHp"></div></div>
    </div>
  </div>

  <!-- HUD SKOR -->
  <div id="scoreHud">
    <span class="score-label">SKOR</span>
    <span class="score-value" id="scoreValue">0</span>
    <div class="wave-info" id="waveInfo">Wave 1 • Musuh: 4</div>
  </div>

  <div class="hint" id="hint">Geser / sentuh untuk mengarahkan layanganmu</div>

  <div id="controls">
    <div class="ctrl-btn" id="btnLeft">◀</div>
    <div class="ctrl-btn" id="btnRight">▶</div>
  </div>

  <div id="waveNotif"></div>

  <!-- GAME OVER -->
  <div id="overlay">
    <h1>🪁 GAME OVER 🪁</h1>
    <p>Skor akhir kamu:</p>
    <div class="final-score" id="finalScore">0</div>
    <div class="new-record" id="newRecord" style="display:none;">🎉 REKOR BARU! 🎉</div>
    <p id="overlayMsg"></p>
    <button id="restartBtn" type="button" onclick="window.__startGame && window.__startGame()">MAIN LAGI</button>
  </div>
</div>

<script>
(function() {
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var menuScreen = document.getElementById('menuScreen');
  var overlay = document.getElementById('overlay');
  var playerHpEl = document.getElementById('playerHp');
  var enemyHpEl = document.getElementById('enemyHp');
  var hud = document.getElementById('hud');
  var scoreHud = document.getElementById('scoreHud');
  var scoreValueEl = document.getElementById('scoreValue');
  var waveInfoEl = document.getElementById('waveInfo');
  var finalScoreEl = document.getElementById('finalScore');
  var newRecordEl = document.getElementById('newRecord');
  var overlayMsg = document.getElementById('overlayMsg');
  var menuHighscore = document.getElementById('menuHighscore');
  var controls = document.getElementById('controls');
  var hint = document.getElementById('hint');
  var waveNotif = document.getElementById('waveNotif');
  var gameContainer = document.getElementById('gameContainer');

  var W = 0, H = 0;
  var dpr = window.devicePixelRatio || 1;

  function resize() {
    var rect = canvas.getBoundingClientRect();
    W = rect.width || window.innerWidth;
    H = rect.height || window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', function() {
    resize();
    if (running) render();
  });
  resize();

  var running = false;
  var lastTime = 0;
  var particles = [];
  var shakeTime = 0;

  // High score
  var highScore = 0;
  try { highScore = parseInt(localStorage.getItem('kiteBattleHS') || '0', 10) || 0; } catch(e) { highScore = 0; }
  updateMenuHighscore();

  function updateMenuHighscore() {
    if (highScore > 0) {
      menuHighscore.textContent = '🏆 Rekor tertinggi: ' + highScore;
    } else {
      menuHighscore.textContent = '🎯 Kalahkan semua musuh!';
    }
  }

  var player = { x: 0, y: 0, vx: 0, vy: 0, hp: 100, maxHp: 100, angle: 0, hitFlash: 0 };
  var enemies = [];
  var score = 0;
  var wave = 1;
  var enemiesKilled = 0;
  var arena = { margin: 40 };

  var COLORS = [
    { b1: '#EF5350', b2: '#B71C1C', s: '#7f0000' },
    { b1: '#AB47BC', b2: '#6A1B9A', s: '#4A148C' },
    { b1: '#FF9800', b2: '#E65100', s: '#BF360C' },
    { b1: '#26A69A', b2: '#00695C', s: '#004D40' },
    { b1: '#EC407A', b2: '#AD1457', s: '#880E4F' },
    { b1: '#5C6BC0', b2: '#283593', s: '#1A237E' }
  ];

  function createEnemy(w, i) {
    var c = COLORS[i % COLORS.length];
    var maxHp = 30 + (w - 1) * 15;
    var speed = 200 + (w - 1) * 30;
    var x = 80 + Math.random() * Math.max(100, W - 160);
    var y = 80 + Math.random() * 120;
    return {
      x: x, y: y, vx: 0, vy: 0,
      hp: maxHp, maxHp: maxHp, angle: 0,
      aiTimer: 0, targetX: x, targetY: y,
      color: c, speed: speed, size: 22, hitFlash: 0
    };
  }

  function spawnWave(w) {
    enemies = [];
    var count = Math.min(7, 3 + w);
    for (var i = 0; i < count; i++) enemies.push(createEnemy(w, i));
    updateHud();
    updateScoreHud();
    showWaveNotification('WAVE ' + w);
  }

  function showWaveNotification(text) {
    waveNotif.textContent = text;
    waveNotif.classList.remove('show');
    void waveNotif.offsetWidth;
    waveNotif.classList.add('show');
  }

  function initGame() {
    resize();
    player.x = W / 2;
    player.y = H - 180;
    player.hp = 100;
    player.vx = 0;
    player.vy = 0;
    player.hitFlash = 0;

    score = 0;
    wave = 1;
    enemiesKilled = 0;
    particles = [];
    shakeTime = 0;

    spawnWave(1);
  }

  function updateHud() {
    playerHpEl.style.width = Math.max(0, player.hp / player.maxHp * 100) + '%';
    var th = 0, tm = 0;
    for (var i = 0; i < enemies.length; i++) {
      th += Math.max(0, enemies[i].hp);
      tm += enemies[i].maxHp;
    }
    var pct = tm > 0 ? (th / tm * 100) : 0;
    enemyHpEl.style.width = pct + '%';
  }

  function updateScoreHud() {
    scoreValueEl.textContent = score;
    var alive = 0;
    for (var i = 0; i < enemies.length; i++) {
      if (enemies[i].hp > 0) alive++;
    }
    waveInfoEl.textContent = 'Wave ' + wave + ' • Musuh: ' + alive;
  }

  var input = { pointerActive: false, x: 0, y: 0, left: false, right: false };

  function getCanvasPos(e) {
    var rect = canvas.getBoundingClientRect();
    var cx = e.touches ? e.touches[0].clientX : e.clientX;
    var cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: cx - rect.left, y: cy - rect.top };
  }

  canvas.addEventListener('mousemove', function(e) {
    if (!running) return;
    var p = getCanvasPos(e);
    input.x = p.x; input.y = p.y; input.pointerActive = true;
  });
  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if (!running) return;
    var p = getCanvasPos(e);
    input.x = p.x; input.y = p.y; input.pointerActive = true;
  }, { passive: false });
  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (!running) return;
    var p = getCanvasPos(e);
    input.x = p.x; input.y = p.y; input.pointerActive = true;
  }, { passive: false });

  window.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft') input.left = true;
    if (e.key === 'ArrowRight') input.right = true;
  });
  window.addEventListener('keyup', function(e) {
    if (e.key === 'ArrowLeft') input.left = false;
    if (e.key === 'ArrowRight') input.right = false;
  });

  function bindHold(btn, key) {
    function down(e) { e.preventDefault(); input[key] = true; }
    function up(e) { e.preventDefault(); input[key] = false; }
    btn.addEventListener('mousedown', down);
    btn.addEventListener('mouseup', up);
    btn.addEventListener('mouseleave', up);
    btn.addEventListener('touchstart', down, { passive: false });
    btn.addEventListener('touchend', up, { passive: false });
    btn.addEventListener('touchcancel', up, { passive: false });
  }
  bindHold(document.getElementById('btnLeft'), 'left');
  bindHold(document.getElementById('btnRight'), 'right');

  function clampToArena(obj) {
    var m = arena.margin;
    if (obj.x < m) { obj.x = m; obj.vx = Math.abs(obj.vx) * 0.5; }
    if (obj.x > W - m) { obj.x = W - m; obj.vx = -Math.abs(obj.vx) * 0.5; }
    if (obj.y < m) { obj.y = m; obj.vy = Math.abs(obj.vy) * 0.5; }
    if (obj.y > H - m) { obj.y = H - m; obj.vy = -Math.abs(obj.vy) * 0.5; }
  }

  function updatePlayer(dt) {
    var speed = 380;
    var dirX = 0, dirY = 0;
    if (input.pointerActive) {
      var dx = input.x - player.x;
      var dy = input.y - player.y;
      var dist = Math.hypot(dx, dy);
      if (dist > 5) { dirX = dx / dist; dirY = dy / dist; }
    } else if (input.left) { dirX = -1; }
    else if (input.right) { dirX = 1; }

    player.vx += (dirX * speed - player.vx) * Math.min(1, dt * 8);
    player.vy += (dirY * speed * 0.6 - player.vy) * Math.min(1, dt * 8);
    player.x += player.vx * dt;
    player.y += player.vy * dt;
    clampToArena(player);
    player.angle = Math.atan2(player.vy, player.vx) || player.angle;
    if (player.hitFlash > 0) player.hitFlash -= dt;
  }

  function updateEnemy(e, dt) {
    if (e.hp <= 0) return;
    e.aiTimer -= dt;
    if (e.aiTimer <= 0) {
      e.aiTimer = 0.4 + Math.random() * 0.7;
      var m = 80;
      var tX = player.x + (Math.random() - 0.5) * 80;
      var tY = player.y + (Math.random() - 0.5) * 80;
      if (e.x < m) tX = W / 2;
      if (e.x > W - m) tX = W / 2;
      if (e.y < m) tY = H / 2 + 100;
      if (e.y > H - m) tY = H / 2;
      e.targetX = tX; e.targetY = tY;
    }
    var dx = e.targetX - e.x;
    var dy = e.targetY - e.y;
    var dist = Math.hypot(dx, dy) || 1;
    e.vx += (dx / dist * e.speed - e.vx) * Math.min(1, dt * 4);
    e.vy += (dy / dist * e.speed - e.vy) * Math.min(1, dt * 4);
    e.x += e.vx * dt;
    e.y += e.vy * dt;
    clampToArena(e);
    e.angle = Math.atan2(e.vy, e.vx) || e.angle;
    if (e.hitFlash > 0) e.hitFlash -= dt;
  }

  function checkCollision() {
    var hitRadius = 42;
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (e.hp <= 0) continue;
      var dx = player.x - e.x;
      var dy = player.y - e.y;
      var dist = Math.hypot(dx, dy);

      if (dist < hitRadius && dist > 0) {
        var pSpeed = Math.hypot(player.vx, player.vy);
        var eSpeed = Math.hypot(e.vx, e.vy);
        var pDmg = eSpeed * 0.045;
        var eDmg = pSpeed * 0.06;

        if (player.y > e.y) pDmg *= 1.2;
        else eDmg *= 1.3;

        eDmg *= 1.2;

        if (pDmg > 0.5) {
          player.hp -= pDmg;
          player.hitFlash = 0.15;
          spawnParticles(e.x, e.y, '#F44336', 6);
          shakeTime = 0.15;
        }
        if (eDmg > 0.5) {
          e.hp -= eDmg;
          e.hitFlash = 0.15;
          spawnParticles(e.x, e.y, '#2196F3', 6);
        }

        var nx = dx / dist, ny = dy / dist;
        var overlap = hitRadius - dist;
        player.x += nx * overlap * 0.5;
        player.y += ny * overlap * 0.5;
        e.x -= nx * overlap * 0.5;
        e.y -= ny * overlap * 0.5;

        var pvx = player.vx, pvy = player.vy;
        player.vx = e.vx * 0.7 + nx * 100;
        player.vy = e.vy * 0.7 + ny * 100;
        e.vx = pvx * 0.7 - nx * 100;
        e.vy = pvy * 0.7 - ny * 100;

        updateHud();

        if (e.hp <= 0) onEnemyKilled(e);
        if (player.hp <= 0) { endGame(); return; }
      }
    }
  }

  function onEnemyKilled(e) {
    var points = 10 + (wave - 1) * 5;
    score += points;
    enemiesKilled++;

    spawnParticles(e.x, e.y, e.color.b1, 20);
    spawnParticles(e.x, e.y, '#FFD700', 10);
    shakeTime = 0.2;

    showFloatingScore(e.x, e.y, '+' + points);
    updateScoreHud();
    updateHud();

    var allDead = true;
    for (var i = 0; i < enemies.length; i++) {
      if (enemies[i].hp > 0) { allDead = false; break; }
    }
    if (allDead) setTimeout(nextWave, 1000);
  }

  function nextWave() {
    if (!running) return;
    wave++;
    score += 25;
    spawnWave(wave);
    updateScoreHud();
  }

  function showFloatingScore(x, y, text) {
    var el = document.createElement('div');
    el.className = 'floating-score';
    el.textContent = text;
    el.style.left = x + 'px';
